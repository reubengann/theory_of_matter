name: Build distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  repository_dispatch:
    types:
      - dependency-updated

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            architecture: x86_64
          - runner: ubuntu-latest
            platform: linux
            architecture: x86_64
          - runner: macos-26
            platform: macos
            architecture: arm64

    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Check out source repositories
        shell: pwsh
        run: >
          ./scripts/checkout-sources.ps1
          -RepoRoot "${{ runner.temp }}/theory-of-matter-sources"

      - name: Build and smoke-test distribution
        shell: pwsh
        run: >
          ./build-distribution.ps1
          -RepoRoot "${{ runner.temp }}/theory-of-matter-sources"
          -OutputDir "${{ github.workspace }}/dist"

      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: theory-of-matter-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
